services:
  mongo:
    image: mongodb/mongodb-community-server:latest
    container_name: mongo
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db
  user-service:
    build: ./user-service
    container_name: user-service
    ports:
      - "4000:4000"
    depends_on:
      - mongo
  task-service:
    build: ./task-service
    container_name: task-service
    ports:
      - "4001:4001"
    depends_on:
      - mongo
      - rabbitmq
  notification-service:
    build: ./notification-service
    container_name: notification-service
    ports:
      - "4002:4002"
    depends_on:
      - mongo
      - rabbitmq
  rabbitmq:
    image: rabbitmq:3-management
    container_name: rabbitmq
    ports:
      - "5672:5672"
      - "15672:15672"
  



volumes:
  mongo-data: